name: Update Live Hub data

on:
  schedule:
    # GitHub may delay scheduled runs during busy periods.
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-hub-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect public data snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and validate source snapshots
        id: collect
        run: node scripts/update-live-data.mjs

      - name: Commit changed snapshots
        if: steps.collect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore(live-hub): refresh public data snapshots [skip ci]"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report skipped commit
        if: steps.collect.outputs.changed != 'true'
        run: echo "No data payload changed or all upstream sources were unavailable; the last good snapshots were preserved."
